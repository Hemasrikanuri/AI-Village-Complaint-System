version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gramsetu_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gramsetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gramsetu_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gramsetu_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gramsetu_user} -d ${POSTGRES_DB:-gramsetu_db}"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gramsetu_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-gramsetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gramsetu_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gramsetu_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gramsetu_user}:${POSTGRES_PASSWORD:-gramsetu_secure_pass_2026}@db:5432/${POSTGRES_DB:-gramsetu_db}
      SECRET_KEY: ${SECRET_KEY:-gramsetu_super_secret_jwt_key_987654321_2026}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      UPLOAD_DIR: app/uploads
      MAX_UPLOAD_SIZE_MB: 5
    volumes:
      - uploads_data:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gramsetu_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
